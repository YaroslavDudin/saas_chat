services:
  db:
    image: postgres:15
    container_name: saas_chat_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=chatbot_db
      - POSTGRES_USER=chatbot_user
      - POSTGRES_PASSWORD=chatbot_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./server
    container_name: saas_chat_web
    env_file:
      - ./server/.env
    restart: unless-stopped
    # В продакшене используем gunicorn
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      - DEBUG=0
      - DB_NAME=chatbot_db
      - DB_USER=chatbot_user
      - DB_PASSWORD=chatbot_password
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    container_name: saas_chat_dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - web

  client:
    build: ./client
    container_name: saas_chat_client
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - web

volumes:
  postgres_data:
